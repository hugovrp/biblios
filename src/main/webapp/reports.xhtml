<?xml version="1.0" encoding="ISO-8859-1" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition template="_template.xhtml"
			    xmlns="http://www.w3.org/1999/xhtml"
			    xmlns:h="http://xmlns.jcp.org/jsf/html"
			    xmlns:f="http://xmlns.jcp.org/jsf/core"
			    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
			    xmlns:p="http://primefaces.org/ui">

    <ui:define name="body">
        <h:form id="reportForm">
            <p:panel header="Relatórios de Empréstimos">
                <p:panelGrid columns="4" styleClass="ui-noborder">
                    <p:outputLabel value="Tipo de Relatório:" />
                    <p:selectOneMenu value="#{loanMB.reportType}">
                        <f:selectItem itemLabel="Todos Emprestados" itemValue="ALL_BORROWED" />
                        <f:selectItem itemLabel="Em Atraso" itemValue="OVERDUE" />
                        <f:selectItem itemLabel="Por Usuário" itemValue="USER" />
                        <p:ajax update="userPanel" />
                    </p:selectOneMenu>

                    <h:panelGroup id="userPanel">
                        <p:selectOneMenu value="#{loanMB.selectedUserForReport}" converter="entityConverter" rendered="#{loanMB.reportType == 'USER'}">
                            <f:selectItem itemLabel="Selecione o Usuário" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{userMB.allUsers}" var="u" itemLabel="#{u.name}" itemValue="#{u}" />
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <p:commandButton value="Gerar" action="#{loanMB.generateReport()}" update="tblReport" icon="pi pi-search" />
                </p:panelGrid>

                <p:dataTable id="tblReport" value="#{loanMB.filteredLoans}" var="loan" style="margin-top:20px" emptyMessage="Nenhum registro encontrado.">
                    <p:column headerText="Usuário">#{loan.user.name}</p:column>
                    <p:column headerText="Revista">#{loan.magazine.edition.series.name}</p:column>
                    <p:column headerText="Data Emp.">
                        <h:outputText value="#{loan.loanDate.time}"><f:convertDateTime pattern="dd/MM/yyyy"/></h:outputText>
                    </p:column>
                    <p:column headerText="Previsão">
                        <h:outputText value="#{loan.expectedReturnDate.time}"><f:convertDateTime pattern="dd/MM/yyyy"/></h:outputText>
                    </p:column>
                    <p:column headerText="Status">#{loanMB.getStatusLabel(loan.status.name())}</p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
