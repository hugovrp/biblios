<?xml version="1.0" encoding="ISO-8859-1" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:h="http://java.sun.com/jsf/html"
	  xmlns:f="http://java.sun.com/jsf/core"
	  xmlns:ui="http://java.sun.com/jsf/facelets"
	  xmlns:p="http://primefaces.org/ui">

	<h:head>
		<title>Biblios</title>
		<h:outputStylesheet name="style.css" library="css"></h:outputStylesheet>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
	</h:head>
	
	<h:body>
		<p:growl id="messages" showDetail="true"><p:autoUpdate /></p:growl>

	    <div id="header">
	        <h:form id="menuForm">
	            <p:menubar rendered="#{userMB.loggedUser != null}">
	                <p:menuitem value="Home" icon="bi bi-house-door" outcome="index" />
	                
	                <p:submenu label="Gerenciar" icon="bi bi-gear" rendered="#{userMB.loggedUser.profile == 'admin'}">
	                    <p:menuitem value="Caixas" outcome="boxes" icon="bi bi-box"/>
	                    <p:menuitem value="Coleções" outcome="series" icon="bi bi-collection"/>
	                    <p:menuitem value="Edições" outcome="editions" icon="bi bi-journal"/>
	                    <p:menuitem value="Revistas" outcome="magazines" icon="bi bi-book"/>
	                    <p:menuitem value="Gerenciar Devoluções" outcome="admin_loans" icon="bi bi-arrow-left-right"/>
	                    <p:menuitem value="Relatórios" outcome="reports" icon="bi bi-graph-up"/>
	                </p:submenu>
	
	                <p:submenu label="Empréstimos">
	                	<p:menuitem value="Solicitar" outcome="request_loan" icon="bi bi-cart-plus"/>
	                	<p:menuitem value="Meu Histórico" outcome="loan_history" icon="bi bi-clock-history"/>
	                </p:submenu>
	
	                <f:facet name="options">
					    <p:commandButton value="Sair (#{userMB.loggedUser.name})" action="#{userMB.logout()}" styleClass="menu-logout-button" />
					</f:facet>
	            </p:menubar>
	        </h:form>
	    </div>
	
	    <div id="content">
	        <ui:insert name="body" />
	    </div>
			
		<div id="footer">
			<p>Copyright © 2026 Biblios. Todos os direitos reservados.</p>
			<p>Desenvolvido por Hugo Vinícius Rodrigues Pereira</p>
		</div>
	</h:body>
</html>
