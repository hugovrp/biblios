<?xml version="1.0" encoding="ISO-8859-1" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Biblios - Confirmação Pendente</title>
        <h:outputStylesheet name="style.css" library="css"></h:outputStylesheet>
    </h:head>

    <h:body>
        <div class="pending-container">
            <p:card>
                <div class="icon-container">
                    <i class="pi pi-envelope"></i>
                </div>
                <h2>Confirme seu E-mail</h2>
                <p>
                    Enviamos um e-mail de confirmação para o endereço cadastrado. 
                    Por favor, verifique sua caixa de entrada (e também a pasta de spam) 
                    e clique no link de confirmação para ativar sua conta.
                </p>
                <div>
                    <p:link value="Voltar para o Login" outcome="login" styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only"/>
                </div>
            </p:card>
        </div>
    </h:body>
</html>
